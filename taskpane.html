<!doctype html><html lang="ja"><head><meta charset="UTF-8"/><meta http-equiv="X-UA-Compatible" content="IE=Edge"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>LaTeX 数式挿入</title><script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script><script defer="defer" src="taskpane.bundle.js"></script><link href="taskpane.css" rel="stylesheet"></head><body><div id="app"><header><span class="header-icon">∑</span><h1>LaTeX 数式挿入</h1></header><main><section class="section"><div class="label-row"><label for="latex-input">LaTeX 入力</label><div class="mode-toggle" role="group" aria-label="表示モード"><button id="display-mode-btn" class="mode-btn active" title="数式を独立行に表示">Display</button> <button id="inline-mode-btn" class="mode-btn" title="インライン表示">Inline</button></div></div><textarea id="latex-input" placeholder="\frac{a^2 + b^2}{c^2}" rows="4" spellcheck="false" autocomplete="off" autocorrect="off"></textarea></section><section class="section"><div class="label-row"><label for="scale-slider">サイズ</label> <span id="scale-display">1.5×</span></div><input type="range" id="scale-slider" min="0.5" max="6" step="0.25" value="1.5"/></section><section class="section row"><label for="color-picker">文字色</label> <input type="color" id="color-picker" value="#000000"/> <span id="color-label">#000000</span></section><section class="section"><label>プレビュー</label><div id="preview-box" aria-live="polite"><div id="preview-render"></div><p id="preview-placeholder" class="placeholder">数式を入力してください</p></div><p id="error-msg" class="error" role="alert"></p></section><button id="insert-btn" class="btn-primary" disabled="disabled">スライドに挿入</button><p id="status-msg" class="status"></p><section class="section"><label>スニペット</label><div id="snippet-list"><button class="snippet-btn" data-latex="\frac{a}{b}">分数</button> <button class="snippet-btn" data-latex="\sqrt{x}">平方根</button> <button class="snippet-btn" data-latex="\int_{a}^{b} f(x)\,dx">積分</button> <button class="snippet-btn" data-latex="\sum_{n=1}^{\infty} a_n">和</button> <button class="snippet-btn" data-latex="\lim_{x \to 0} \frac{\sin x}{x}">極限</button> <button class="snippet-btn" data-latex="\begin{pmatrix} a & b \\ c & d \end{pmatrix}">行列</button> <button class="snippet-btn" data-latex="e^{i\pi} + 1 = 0">オイラー</button> <button class="snippet-btn" data-latex="\nabla \cdot \mathbf{E} = \frac{\rho}{\varepsilon_0}">Maxwell</button></div></section><section class="section" id="history-section" style="display:none"><div class="label-row"><label>最近使った数式</label> <button id="clear-history-btn" class="link-btn">クリア</button></div><div id="history-list"></div></section></main></div></body></html>
