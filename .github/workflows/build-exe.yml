name: Build Renderer EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: renderer/package-lock.json

      - name: Install renderer dependencies
        run: npm ci
        working-directory: renderer

      - name: Apply MathJax Node.js compatibility patch
        shell: pwsh
        run: |
          $file = "renderer/node_modules/mathjax-full/js/input/tex/base/BaseConfiguration.js"
          (Get-Content $file) -replace 'range\[4\] && mo\.attributes', 'range && range[4] && mo.attributes' | Set-Content $file
          Write-Host "Patch applied."

      - name: Build exe with pkg
        run: npx pkg render.js --target node18-win-x64 --output latex-renderer.exe --compress GZip
        working-directory: renderer

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: renderer/latex-renderer.exe
          body: |
            ## インストール方法

            1. `latex-renderer.exe` をダウンロード
            2. `LaTeXInserter.ppam` と**同じフォルダ**に配置
            3. PowerPoint を再起動

            詳細: [README](https://github.com/yuuukichiiii/latex-eq-pptx#readme)
